<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panorama Splitter</title>
<meta name="description" content="Split a panorama into seamless Instagram carousel slides.">
<meta name="theme-color" content="#0B6E75">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#E8ECEE;--surface:#fff;--ink:#17242E;--muted:#5A6B77;--line:#C9D1D6;--accent:#0B6E75;--accent-ink:#fff;--cut:#D6336C;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#10171C;--surface:#18222A;--ink:#E4EAEE;--muted:#93A3AE;--line:#2C3A44;--accent:#3FB5BC;--accent-ink:#06262A;--cut:#F06595}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.75rem;line-height:1.15;margin:8px 0 4px;letter-spacing:-.01em;font-weight:750}
header p{margin:0;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#drop{margin-top:24px;border:2px dashed var(--line);border-radius:14px;padding:56px 20px;text-align:center;background:var(--surface)}
#drop.over{border-color:var(--accent)}
#drop p{color:var(--muted);margin:14px 0 0;font-size:.95rem}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
#editor[hidden],#drop[hidden]{display:none}
.stage{margin-top:20px;background:var(--surface);border-radius:14px;padding:14px}
#strip{display:block;width:100%;height:auto;border-radius:4px}
#hint{margin:10px 2px 0;color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums}
.controls{margin-top:14px;background:var(--surface);border-radius:14px;padding:4px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row[hidden]{display:none}
.label{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.step{display:inline-flex;align-items:center;gap:6px}
.step>button:not(.chip){width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;font-size:1.25rem;line-height:1}
#n{min-width:2ch;text-align:center;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.chip{margin-left:6px;border:1px solid var(--line);background:none;border-radius:999px;padding:7px 12px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{flex:1 1 200px;accent-color:var(--accent);min-height:32px}
.preview{margin-top:14px;background:var(--surface);border-radius:14px;padding:16px 14px}
.preview p{margin:0 0 12px;color:var(--muted);font-size:.92rem;text-align:center}
.car{max-width:300px;margin:0 auto;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:8px;background:#000;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car canvas{flex:0 0 100%;width:100%;height:auto;scroll-snap-align:start;cursor:pointer}
#count{text-align:center;margin-top:8px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.actions .btn{flex:1 1 160px}
#status{min-height:1.5em;margin:12px 2px 0;color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Panorama Splitter</h1>
    <p>Cut a wide photo into slides that line up seamlessly in an Instagram carousel.</p>
  </header>

  <section id="drop">
    <button class="btn primary" id="pick">Choose a panorama</button>
    <p>Or drop or paste an image here. Photos never leave your device.</p>
  </section>
  <input type="file" id="file" accept="image/*" hidden>

  <section id="editor" hidden>
    <div class="stage">
      <canvas id="strip" aria-label="Panorama with slide cut lines"></canvas>
      <p id="hint"></p>
    </div>

    <div class="controls">
      <div class="row">
        <span class="label">Slides</span>
        <span class="step">
          <button id="minus" aria-label="Fewer slides">−</button>
          <span id="n" aria-live="polite">3</span>
          <button id="plus" aria-label="More slides">+</button>
          <button class="chip" id="auto" aria-pressed="true">Auto</button>
        </span>
      </div>
      <div class="row">
        <span class="label">Shape</span>
        <span class="seg" data-key="ratio">
          <button data-v="1">Square 1:1</button>
          <button data-v="0.8">Portrait 4:5</button>
        </span>
      </div>
      <div class="row">
        <span class="label">Fill</span>
        <span class="seg" data-key="fit">
          <button data-v="crop">Crop</button>
          <button data-v="fit">Fit whole photo</button>
        </span>
      </div>
      <div class="row" id="posRow">
        <label class="label" for="pos">Position</label>
        <input type="range" id="pos" min="0" max="1" step="0.005" value="0.5">
      </div>
      <div class="row" id="bgRow">
        <span class="label">Bars</span>
        <span class="seg" data-key="bg">
          <button data-v="#ffffff">White</button>
          <button data-v="#000000">Black</button>
        </span>
      </div>
    </div>

    <div class="preview">
      <p>Carousel preview. Swipe to check the seams, tap a slide to save it on its own.</p>
      <div class="car" id="car"></div>
      <div id="count"></div>
    </div>

    <div class="actions">
      <button class="btn primary" id="share" hidden>Share slides</button>
      <button class="btn" id="zip">Download ZIP</button>
      <button class="btn" id="change">Change photo</button>
    </div>
    <p id="status" role="status"></p>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const OUT_W = 1080, MAX_N = 20;
const state = { img:null, name:'panorama', n:3, auto:true, ratio:1, fit:'crop', pos:.5, bg:'#ffffff' };
const status = t => { $('#status').textContent = t || ''; };

// ---------- loading ----------
function imgDims(){ const i=state.img; return [i.naturalWidth||i.width, i.naturalHeight||i.height]; }

function viaImg(file){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
}

async function loadFile(file){
  if(!file) return;
  if(file.type && !file.type.startsWith('image/')){ status('That file isn’t an image. Choose a JPEG, PNG or WebP photo.'); return; }
  try{
    let img;
    try{ img = await createImageBitmap(file, { imageOrientation:'from-image' }); }
    catch{ img = await viaImg(file); }
    state.img = img;
    state.name = (file.name||'panorama').replace(/\.[^.]+$/,'') || 'panorama';
    state.auto = true; state.pos = .5; $('#pos').value = .5;
    $('#drop').hidden = true; $('#editor').hidden = false; status('');
    render();
  }catch{
    $('#drop').hidden = false;
    status('Couldn’t read this image. If it’s HEIC, export it as JPEG first.');
  }
}

$('#pick').onclick = () => $('#file').click();
$('#change').onclick = () => $('#file').click();
$('#file').onchange = e => { loadFile(e.target.files[0]); e.target.value=''; };

const drop = $('#drop');
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over');}));
document.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
document.addEventListener('paste', e => {
  const item=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'));
  if(item) loadFile(item.getAsFile());
});

// ---------- geometry ----------
function autoN(){
  const [iw,ih]=imgDims();
  return Math.min(MAX_N, Math.max(2, Math.round((iw/ih)/state.ratio)));
}
function geo(){
  const [iw,ih]=imgDims(), W=OUT_W, H=Math.round(OUT_W/state.ratio), SW=W*state.n;
  const crop = state.fit==='crop';
  const s = crop ? Math.max(SW/iw, H/ih) : Math.min(SW/iw, H/ih);
  const dw=iw*s, dh=ih*s;
  const ox = crop ? (SW-dw)*state.pos : (SW-dw)/2;
  const oy = crop ? (H-dh)*state.pos : (H-dh)/2;
  return {W,H,SW,dw,dh,ox,oy};
}
function drawSlice(ctx,i,g,k){
  ctx.fillStyle=state.bg; ctx.fillRect(0,0,g.W*k,g.H*k);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(state.img,(g.ox-i*g.W)*k,g.oy*k,g.dw*k,g.dh*k);
}

// ---------- rendering ----------
let raf=0;
function render(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(draw); }

function draw(){
  if(!state.img) return;
  if(state.auto) state.n=autoN();
  $('#n').textContent=state.n;
  $('#auto').setAttribute('aria-pressed',state.auto);
  $('#minus').disabled = state.n<=2; $('#plus').disabled = state.n>=MAX_N;
  document.querySelectorAll('.seg').forEach(seg=>{
    seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(state[seg.dataset.key])===b.dataset.v));
  });

  const g=geo(), dpr=window.devicePixelRatio||1;
  const cs=getComputedStyle(document.documentElement);

  // strip
  const cv=$('#strip'), cw=Math.round(cv.clientWidth*dpr), k=cw/g.SW;
  cv.width=cw; cv.height=Math.max(1,Math.round(g.H*k));
  const c=cv.getContext('2d');
  c.fillStyle=state.bg; c.fillRect(0,0,cv.width,cv.height);
  c.imageSmoothingQuality='high';
  c.drawImage(state.img,g.ox*k,g.oy*k,g.dw*k,g.dh*k);
  c.strokeStyle=cs.getPropertyValue('--cut').trim(); c.lineWidth=2*dpr; c.setLineDash([6*dpr,4*dpr]);
  for(let i=1;i<state.n;i++){ const x=Math.round(i*g.W*k)+.5; c.beginPath(); c.moveTo(x,0); c.lineTo(x,cv.height); c.stroke(); }
  c.setLineDash([]);
  const sw=g.W*k;
  if(sw>=26*dpr){
    c.font=`600 ${11*dpr}px system-ui,sans-serif`; c.textBaseline='middle'; c.textAlign='center';
    for(let i=0;i<state.n;i++){
      const x=i*sw+6*dpr, y=6*dpr, r=9*dpr;
      c.fillStyle='rgba(0,0,0,.6)'; c.beginPath(); c.arc(x+r,y+r,r,0,Math.PI*2); c.fill();
      c.fillStyle='#fff'; c.fillText(i+1,x+r,y+r+.5*dpr);
    }
  }

  // hint + conditional controls
  const crop=state.fit==='crop';
  let note;
  if(crop){
    if(g.dw>g.SW+1) note=`Trims ${Math.round((1-g.SW/g.dw)*100)}% from the sides.`;
    else if(g.dh>g.H+1) note=`Trims ${Math.round((1-g.H/g.dh)*100)}% from the top and bottom.`;
    else note='Fits exactly, nothing trimmed.';
  }else{
    if(g.dw<g.SW-1) note='Adds bars on the left and right.';
    else if(g.dh<g.H-1) note='Adds bars above and below.';
    else note='Fits exactly, no bars.';
  }
  $('#hint').textContent=`${state.n} slides at ${g.W} × ${g.H} px. ${note}`;
  $('#posRow').hidden = !(crop && (g.dw>g.SW+1 || g.dh>g.H+1));
  $('#bgRow').hidden = crop;

  // carousel
  const car=$('#car'), pw=Math.round(Math.min(300,car.clientWidth||300)*dpr), k2=pw/g.W;
  while(car.children.length<state.n){
    const cc=document.createElement('canvas');
    cc.onclick=()=>saveOne([...car.children].indexOf(cc));
    car.appendChild(cc);
  }
  while(car.children.length>state.n) car.lastChild.remove();
  [...car.children].forEach((cc,i)=>{
    cc.width=pw; cc.height=Math.round(g.H*k2);
    cc.setAttribute('aria-label',`Slide ${i+1} of ${state.n}`);
    drawSlice(cc.getContext('2d'),i,g,k2);
  });
  updateCount();
}

function updateCount(){
  const car=$('#car'); const i=Math.round(car.scrollLeft/Math.max(1,car.clientWidth));
  $('#count').textContent=`${Math.min(i+1,state.n)} / ${state.n}`;
}
$('#car').addEventListener('scroll',updateCount,{passive:true});
window.addEventListener('resize',render);

// ---------- controls ----------
$('#minus').onclick=()=>{ state.auto=false; state.n=Math.max(2,state.n-1); render(); };
$('#plus').onclick=()=>{ state.auto=false; state.n=Math.min(MAX_N,state.n+1); render(); };
$('#auto').onclick=()=>{ state.auto=!state.auto; render(); };
$('#pos').oninput=e=>{ state.pos=+e.target.value; render(); };
document.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const key=seg.dataset.key; state[key]= key==='ratio' ? +b.dataset.v : b.dataset.v;
  render();
}));

// ---------- export ----------
function fileName(i){ return `${state.name}_${String(i+1).padStart(2,'0')}.jpg`; }

async function makeFile(i,g){
  const c=document.createElement('canvas'); c.width=g.W; c.height=g.H;
  drawSlice(c.getContext('2d'),i,g,1);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));
  return new File([blob],fileName(i),{type:'image/jpeg'});
}
async function makeFiles(){
  const g=geo(), out=[];
  for(let i=0;i<state.n;i++){ status(`Preparing slide ${i+1} of ${state.n}…`); out.push(await makeFile(i,g)); }
  return out;
}
function download(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}
async function saveOne(i){
  if(i<0) return;
  const f=await makeFile(i,geo()); download(f,f.name); status(`Saved ${f.name}.`);
}

// minimal store-only ZIP writer
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=~0;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(~c)>>>0}
async function zip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  for(const f of files){
    const data=new Uint8Array(await f.arrayBuffer()), name=enc.encode(f.name), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true);
    parts.push(lh,name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true); ch.setUint32(42,off,true);
    central.push(ch,name);
    off+=30+name.length+data.length;
  }
  const size=central.reduce((s,p)=>s+p.byteLength,0), end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,size,true); end.setUint32(16,off,true);
  return new Blob([...parts,...central,end],{type:'application/zip'});
}

$('#zip').onclick=async()=>{
  const btn=$('#zip'); btn.disabled=true;
  try{ const files=await makeFiles(); download(await zip(files),`${state.name}_slides.zip`); status(`Saved ${state.name}_slides.zip with ${files.length} slides.`); }
  catch{ status('Couldn’t create the ZIP. Try fewer slides or a smaller photo.'); }
  btn.disabled=false;
};

const canShareFiles = !!(navigator.canShare && navigator.canShare({files:[new File([''],'t.jpg',{type:'image/jpeg'})]}));
$('#share').hidden=!canShareFiles;
$('#share').onclick=async()=>{
  const btn=$('#share'); btn.disabled=true;
  try{ const files=await makeFiles(); status(''); await navigator.share({files}); status('Shared. Keep the slides in order when posting.'); }
  catch(e){ status(e.name==='AbortError' ? '' : 'Sharing failed. Use Download ZIP instead.'); }
  btn.disabled=false;
};

// ---------- PWA ----------
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// image shared from another app (Android share sheet, installed app only)
(async()=>{
  if(!new URLSearchParams(location.search).has('shared') || !('caches' in window)) return;
  history.replaceState(null,'',location.pathname);
  const cache=await caches.open('share-target'), res=await cache.match('shared-image');
  if(!res) return;
  const blob=await res.blob(), name=decodeURIComponent(res.headers.get('X-Filename')||'shared.jpg');
  await cache.delete('shared-image');
  loadFile(new File([blob],name,{type:blob.type||'image/jpeg'}));
})();
</script>
</body>
</html>
